      if (autoPlayIntro) {
        playAudioCode("45_ket_thuc", null, false);
        playSfx("fanfare");
      }

      footerGuide.textContent = "Chúc mừng em đã hoàn thành xuất sắc Hoạt động Khám phá!";

      container.innerHTML = `
        <div class="finish-layout">
          <div class="finish-badge-card">
            <img src="ui/12_badge.png" alt="Huy hiệu Nghệ nhân nhí tài ba" class="badge-hero" />
            <h3 style="font-size:34px; color:var(--blue-dark);">NGHỆ NHÂN NHÍ TÀI BA</h3>
            ${renderStarsBarHTML()}
          </div>

          <div class="finish-summary-card">
            <div>
              <h2 class="screen-heading" style="text-align:left; font-size:40px; margin-bottom:10px;">
                Hoàn thành Hoạt động Khám phá!
              </h2>
              <div class="keyword-box-list">
                <div class="keyword-item">
                  <div class="keyword-label">1. Nhận biết nghề & sản phẩm thủ công</div>
                  <div class="keyword-value">Nghề làm gốm, nghề mây tre đan, nghề dệt vải thổ cẩm, nghề làm tranh Đông Hồ và các nghề thủ công quanh em.</div>
                </div>
                <div class="keyword-item item-yellow">
                  <div class="keyword-label">2. Hiểu rõ ích lợi</div>
                  <div class="keyword-value">Sản phẩm thủ công phục vụ đời sống sinh hoạt, trang trí, giữ gìn văn hóa và đem lại thu nhập cho người lao động.</div>
                </div>
                <div class="keyword-item item-green">
                  <div class="keyword-label">3. Lời dặn của cô Hoàng Thị Tâm</div>
                  <div class="keyword-value">Luôn trân trọng công sức của người lao động, giữ gìn đồ dùng cẩn thận và sẵn sàng bước sang hoạt động tiếp theo của tiết học!</div>
                </div>
              </div>
            </div>

            <div style="display:flex; gap:18px;">
              <button type="button" class="ui-btn ui-btn-blue" style="flex:1;" onclick="resetAllAndReplay()">

              </button>
              <button type="button" class="ui-btn ui-btn-yellow" style="flex:1;" onclick="playAudioCode('45_ket_thuc', null, false)">

      footerAction.innerHTML = `
        <button type="button" class="ui-btn ui-btn-blue" onclick="goHomeScreen()">
          <img src="ui/09_icon_home.png" alt="" class="btn-icon" />
          <span>Về đầu bài</span>
        </button>
      `;
    }

    function resetAllAndReplay() {
      state.exploredCrafts = {};
      state.duBonNghePlayed = false;
      state.quizIndex = 0;
      state.quizSelected = null;
      state.quizAnswered = {};
      state.quizFeedback = null;
      state.exploredBenefits = {};
      state.exploredExtended = {};
      state.memoRead = false;
      state.gameIndex = 0;
      state.gameStars = [false, false, false, false, false];
      state.gameSinglePick = null;
      state.gameMultiPicks = {};
      state.gameMatches = {};
      state.gameFeedback = null;
      goToScreen("explore_grid", true);
    }

    /*************************************************************************
     * 6. TÍCH HỢP CHUẨN LMS SCORM 1.2 & SCORM 2004 + CO GIÃN TỈ LỆ 16:9
     *************************************************************************/
    const SCORM_BRIDGE = {
      api12: null,
      api2004: null,
      initialized: false,
      startTime: Date.now(),

      findAPI(win) {
        let attempts = 0;
        while (win && attempts < 15) {
          if (win.API_1484_11) return { type: "2004", api: win.API_1484_11 };
          if (win.API) return { type: "1.2", api: win.API };
          if (win.parent && win.parent !== win) win = win.parent;
          else break;
          attempts++;
        }
        return null;
      },

      init() {
        if (this.initialized) return;
        try {
          const found = this.findAPI(window) || (window.opener ? this.findAPI(window.opener) : null);
          if (!found) return;
          if (found.type === "2004") {
            this.api2004 = found.api;
            this.api2004.Initialize("");
            this.api2004.SetValue("cmi.completion_status", "incomplete");
            this.api2004.SetValue("cmi.score.min", "0");
            this.api2004.SetValue("cmi.score.max", "100");
            this.api2004.Commit("");
          } else {
            this.api12 = found.api;
            this.api12.LMSInitialize("");
            this.api12.LMSSetValue("cmi.core.lesson_status", "incomplete");
            this.api12.LMSSetValue("cmi.core.score.min", "0");
            this.api12.LMSSetValue("cmi.core.score.max", "100");
            this.api12.LMSCommit("");
          }
          this.initialized = true;
        } catch (e) {}
      },

      report(pct, screenName) {
        if (!this.initialized) return;
        try {
          const completed = (pct >= 100 || screenName === "finish");
          if (this.api2004) {
            this.api2004.SetValue("cmi.score.raw", String(pct));
            this.api2004.SetValue("cmi.score.scaled", String((pct / 100).toFixed(2)));
            this.api2004.SetValue("cmi.location", String(screenName || ""));
            this.api2004.SetValue("cmi.completion_status", completed ? "completed" : "incomplete");
            if (completed) this.api2004.SetValue("cmi.success_status", "passed");
            this.api2004.Commit("");
          } else if (this.api12) {
            this.api12.LMSSetValue("cmi.core.score.raw", String(pct));
            this.api12.LMSSetValue("cmi.core.lesson_location", String(screenName || ""));
            this.api12.LMSSetValue("cmi.core.lesson_status", completed ? "passed" : "incomplete");
            this.api12.LMSCommit("");
          }
        } catch (e) {}
      },

      finish() {
        if (!this.initialized) return;
        try {
          if (this.api2004) {
            this.api2004.Commit("");
            this.api2004.Terminate("");
          } else if (this.api12) {
            this.api12.LMSCommit("");
            this.api12.LMSFinish("");
          }
          this.initialized = false;
        } catch (e) {}
      }
    };

    const _origUpdateProgressBarUI = updateProgressBarUI;
    updateProgressBarUI = function() {
      _origUpdateProgressBarUI();
      const pct = computeProgressPercent();
      SCORM_BRIDGE.report(pct, state.screen);
    };

    function fitStage16x9() {
      const stage = document.getElementById("stage-wrapper");
      if (!stage) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = Math.min(vw / 1600, vh / 900);
      stage.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", fitStage16x9);
    window.addEventListener("beforeunload", () => SCORM_BRIDGE.finish());
    window.addEventListener("DOMContentLoaded", () => {
      SCORM_BRIDGE.init();
      fitStage16x9();
      renderApp(true);
    });
  </script>
